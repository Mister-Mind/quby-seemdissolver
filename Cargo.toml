[package]
name = "quby-seemdissolver"
version = "1.3.4"
license = "MIT"
description = "Seamless texture editor and PBR material asset browser"
edition = "2021"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts","glow"] }
image = { version = "0.25", default-features = false, features = ["png","jpeg","bmp","tiff","webp"] }
rfd = "0.15"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde_json = "1"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.dev]
debug = 0


